[mod-setting-name]
territorio-expansion-levels=Territory limit

[mod-setting-description]
territorio-expansion-levels=How far each Territorial Expansion research can repeat. Every level past the first is 1 more expansion token, so this caps how much of the map you can ever own.\nStartup setting, so it is fixed when the game loads. Changing it on an existing save is safe, including lowering it below what you already researched.

[string-mod-setting]
territorio-expansion-levels-easy=Easy (10 levels)
territorio-expansion-levels-medium=Medium (5 levels)
territorio-expansion-levels-hard=Hard (3 levels)

