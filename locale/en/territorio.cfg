[technology-description]
territorio-expansion-red=Claim more of the map. Level 1 grants 6 expansion tokens, each further level 1 more at a rising science cost.\nSpend tokens from the map view on chunks adjacent to your territory. The Territory limit setting caps the number of levels.
territorio-expansion-green=Claim more of the map. Level 1 grants 8 expansion tokens, each further level 1 more at a rising science cost.\nSpend tokens from the map view on chunks adjacent to your territory. The Territory limit setting caps the number of levels.
territorio-expansion-blue=Claim more of the map. Level 1 grants 10 expansion tokens, each further level 1 more at a rising science cost.\nSpend tokens from the map view on chunks adjacent to your territory. The Territory limit setting caps the number of levels.
territorio-expansion-purple=Claim more of the map. Level 1 grants 12 expansion tokens, each further level 1 more at a rising science cost.\nSpend tokens from the map view on chunks adjacent to your territory. The Territory limit setting caps the number of levels.
territorio-expansion-yellow=Claim more of the map. Level 1 grants 15 expansion tokens, each further level 1 more at a rising science cost.\nSpend tokens from the map view on chunks adjacent to your territory. The Territory limit setting caps the number of levels.
territorio-artillery-strike=The late-game artillery capstone. Kills bank strike charges from the very start of the game, and this is what lets you spend them. Arm Strike on the Territorio widget and click the map to bombard that spot.\nHigher tiers fire a heavier barrage and bank charges faster. Friendly fire is on, so do not call it on your own doorstep.
territorio-mini-artillery=A fixed mortar that fires only at targets you designate with the artillery remote, 24 to 192 tiles. It never fires on its own, and it unlocks a free remote in the shortcut bar.\nIts shells are packed grenades, so they wear nests down rather than delete them, and Stronger Explosives raises their damage.
territorio-border-wall=Builds and maintains a free stone-wall ring on the outer edge of your territory. It extends and pulls back as you claim or sell chunks, and damaged sections slowly heal.\nA section the biters DESTROY stays a hole until you patch it by hand. Automatic repair is what Perimeter Defense buys.
territorio-surveillance=Continuously charts the fog of war around your whole territory border, with no radar to place. Building real radars speeds the sweep up.
territorio-surveillance-deep=Widens the surveillance band and adds a sector pulse. It charges over time, and the Scan button on the Territorio widget spends a charge to chart a large stretch of map outward.\nOnly one charge banks at a time, so spend it before it caps.
territorio-prospecting=Charts every chunk holding an ore patch within 20 chunks of your territory, so distant oil shows as an island in the fog instead of guesswork.\nRuns when you research it and again each time you claim ground, and its reach grows as you expand.
territorio-resource-synthesis=Fabricate ore. Arm Synthesize on the Territorio widget, pick a resource, then select one of your own chunks to fill it with a patch. Costs 2 tokens per chunk.\nSelect the same chunk again to top it up and widen it to your current tier. Later tiers unlock more resources, richer ore and a bigger patch.
territorio-chunk-refund=Sell a chunk back for the expansion token you paid for it, always 1:1. Arm Refund on the Territorio widget and drag a box over your own chunks on the map.\nEach tier decides how much SURVIVES the sale. Tier 1 destroys everything, tier 2 leaves your buildings standing but dead and unpowered, tier 3 keeps the border wall too. You cannot sell a starting chunk, or one that would strand the rest of your territory.
territorio-missile-battery=A single long-range missile emplacement, fired with the Missile salvo button on the Territorio widget. It loads vanilla missiles straight off your bus, so its firepower is limited by what your factory can produce. Reaches 96 to 528 tiles.\nMost effective with EXPLOSIVE rockets. A plain rocket has no blast radius and only damages what it lands on.\nOnly one can exist per surface, and it SUPERSEDES the Mortar. Every artillery emplacement in range shares one salvo, so a Mortar standing nearby eats missiles meant for the battery.
territorio-beautification=Paves every land tile of your territory, free and re-applied whenever you claim ground, which also clears the walking slowdown on rough terrain. Each tier upgrades the floor from stone brick to concrete to refined concrete.\nHazard-concrete markings and water are left alone.
territorio-perimeter-defense=Breaches in the border wall are rebuilt for free on the maintenance sweep, so a wave that gets through no longer leaves a hole for you to patch by hand.
territorio-perimeter-defense-teeth=Adds two staggered rows of free stone-wall just beyond your border. Dragon's teeth that break up an approach without costing more materials than the wall itself.\nTeeth the biters destroy are rebuilt free on the maintenance sweep.
territorio-perimeter-defense-mines=A ring of free land mines out at the distance a spitter stops to attack, so it is standing on them rather than shelling your wall from safety. Anything that walks in crosses them first.\nTriggered mines are replaced on the next sweep.
territorio-perimeter-defense-dense-mines=Adds a second row of mines further out and offset sideways, so the field zig-zags instead of lining up behind itself. Reaches the bigger spitters that stop past the first row.

