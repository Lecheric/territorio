intro=You are boxed in.\nTerritorio locks you to your four starting chunks. The hazard-striped band on the ground is the edge, and walking into it will simply stop you.\nYou begin with 10 expansion tokens. Open the Territorio widget in the top right, arm the Expansion tool, then drag a box on the map over any chunk touching your territory. One token buys one chunk.\nSpend those first 10 deliberately. You need to reach ore, and above all you need to reach WATER, because until you do you have no power at all. Look at the map before you buy.\nAfter that, tokens come from research. Every Territorial Expansion technology grants more.\nOne rule worth knowing early: the border holds only YOU and your buildings. Construction robots fly straight over it, and so do the biters.

