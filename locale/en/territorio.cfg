[entity-description]
territorio-missile-battery=Most effective with EXPLOSIVE rockets. A plain rocket has no blast radius and only damages what it lands on. Atomic bombs load as well.\nFire it with the Missile salvo button on the Territorio widget. The plain artillery remote sends a single missile instead.

[item-description]
territorio-missile-battery=Most effective with EXPLOSIVE rockets. A plain rocket has no blast radius and only damages what it lands on. Only one can exist per surface.
territorio-missile-remote=Sends the Missile Battery full eight-missile salvo into a tight cluster where you click. Most effective with EXPLOSIVE rockets. The plain artillery remote sends a single missile instead.

