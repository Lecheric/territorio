[territorio-gui]
tool=Expansion tool (__1__)
strike=Strike (__1__)
scan=Scan (__1__)
synth=Synthesize (Lv __1__)
synth-tooltip=Ore Generator. Opens a resource picker. Pick one, then select an owned chunk on the map to fill it with a patch, 2 tokens per chunk.\nWhich resources you can pick and how rich the patch is both scale with the tier shown above. Right-click or Q to put the tool away.
synth-pick=Synthesize __1__
synth-pick-locked=Synthesize __1__, requires Resource Synthesis tier __2__
expansion-tooltip=__1__ chunks claimed.\nArm the tool, then drag a box over highlighted chunks on the map to claim them, 1 token each. Right-click or Q to put it away. Drag the handle to move this widget.
strike-tooltip=Charges are earned by killing enemies, and kills you land yourself are worth double what your turrets earn. Arm this, then click a spot on the map to call a barrage from your base for 1 charge.\nFriendly fire is on.
strike-locked=Charges bank as you kill enemies, but firing needs the Territorial Artillery Strike research, which is late game and needs Production and Utility science. The Mortar covers the early game and the Missile Battery covers the middle.
salvo=Missile salvo
salvo-tooltip=Puts the Missile salvo remote in your hand. Click the map and the battery answers with eight missiles in a tight cluster.\nMost effective with EXPLOSIVE rockets. The plain artillery remote fires a single precision missile instead. Right-click or Q to put it away.
scan-tooltip=Sector pulse. Charges over time, and spends 1 charge to chart a large area outward from your territory. Only one charge banks at a time.
scan-locked=Requires Deep-Range Surveillance.
refund=Refund
refund-tooltip=Sell chunks back for 1 token each, tier __1__. Arm this, then drag a box over your OWN chunks on the map.\nTier 1 destroys everything on them, tier 2 leaves buildings standing but unpowered, tier 3 keeps the border wall. Starting chunks cannot be sold, and neither can a chunk that would strand the rest of your territory. Right-click or Q to put it away.
